/* ================= Apple Kalender (.ics) ================= */
function icsUnesc(v){ return v.replace(/\\n/gi, '\n').replace(/\\([,;\\])/g, '$1'); }
function icsDate(val, params){
  const m = val.match(/^(\d{4})(\d{2})(\d{2})(?:TL(\d{2})(\d{2})(\d{2})?(Z?))?/); if (!m) return null;
  if (!m[4] || /VALUE=DATE(?!-)/.test(params)) return {date:`${m[1]}-${m[2]}-${m[3]}`, time:''};
  if (m[7] === 'Z'){ const d = new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5])); return {date:ds(d), time:`${pad(d.getHours())}:${pad(d.getMinutes())}`}; }
  return {date:`${m[1]}-${m[2]}-${m[3]}`, time:`${m[4]}:${m[5]}`};
}
function parseICS(text){
  const lines = text.replace(/\r?\n[ \t]/g, '').split(/\r?\n/), out = [];
  let ev = null;
  for (const ln of lines){
    if (ln === 'BEGIN:VEVENT'){ ev = {ex:[]}; continue; }
    if (ln === 'END:VEVENT'){ if (ev) out.push(ev); ev = null; continue; }
    if (!ev) continue;
    const ci = ln.indexOf(':'); if (ci < 0) continue;
    const left = ln.slice(0, ci), val = ln.slice(ci + 1), name = left.split(';')[0].toUpperCase(), params = left.slice(name.length);
    if (name === 'SUMMARY') ev.title = icsUnesc(val);
    else if (name === 'LOCATION') ev.place = icsUnesc(val);
    else if (name === 'DESCRIPTION') ev.note = icsUnesc(val).slice(0, 2000);
    else if (name === 'UID') ev.uid = val;
    else if (name === 'DTSTART') ev.s = icsDate(val, params);
    else if (name === 'DTEND') ev.e = icsDate(val, params);
    else if (name === 'RRULE') ev.rr = Object.fromEntries(val.split(';').map(x => x.split('=')));
    else if (name === 'EXDATE') val.split(',').forEach(v => { const d = icsDate(v, params); if (d) ev.ex.push(d.date); });
    else if (name === 'RECURRENCE-ID') ev.rid = true;
    else if (name === 'STATUS' && val === 'CANCELLED') ev.cancel = true;
  }
  const from = addDays(today(), -30);
  return out.filter(e => e.s && !e.cancel && !e.rid).map(e => {
    let repeat = 'none', until = '', cx = {};
    if (e.rr){
      const f = e.rr.FREQ, iv = Number(e.rr.INTERVAL || 1), by = (e.rr.BYDAY || '').split(',').filter(Boolean);
      if (f === 'DAILY' && iv === 1) repeat = 'daily';
      else if (f === 'WEEKLY' && iv === 1 && by.length === 5 && ['MO','TU','WE','TH','FR'].every(x => by.includes(x))) repeat = 'weekdays';
      else if (f === 'WEEKLY' && iv <= 2 && by.length <= 1) repeat = iv === 2 ? 'biweekly' : 'weekly';
      else if (f === 'MONTHLY' && iv === 1 && !e.rr.BYDAY) repeat = 'monthly';
      else if (f === 'YEARLY' && iv === 1 && !e.rr.BYDAY) repeat = 'yearly';
      else if (['DAILY', 'WEEKLY', 'MONTHLY', 'YEARLY'].includes(f) && !(f !== 'WEEKLY' && e.rr.BYDAY)){ repeat = 'custom'; cx = {rint:iv, runit:{DAILY:'d', WEEKLY:'w', MONTHLY:'m', YEARLY:'y'}[f], rdays:f === 'WEEKLY' ? (by.length ? by.map(x => String(['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'].indexOf(x.slice(-2)))).filter(x => x !== '-1') : [String(wdIdx(pd(e.s.date)))]) : []}; }
      if (e.rr.UNTIL) until = (icsDate(e.rr.UNTIL, '') || {}).date || '';
      else if (e.rr.COUNT && repeat !== 'none') until = seriesEnd({date:e.s.date, repeat, ...cx, rcount:Number(e.rr.COUNT)});
    }
    return {iuid:e.uid || uid(), title:e.title || 'Termin', date:e.s.date, start:e.s.time, end:e.e && e.e.date === e.s.date ? e.e.time : '', place:e.place || '', note:e.note || '', repeat, until, skip:e.ex, ...cx};
  }).filter(e => e.date >= from || (e.repeat !== 'none' && (!e.until || e.until >= from)));
}
function importICS(text, cat){
  const list = parseICS(text); if (!list.length) return 0;
  list.forEach(e => {
    const old = S.events.find(x => x.iuid && x.iuid === e.iuid);
    const o = {id:old ? old.id : uid(), type:cat, rem:old ? old.rem : null, ...e};
    old ? Object.assign(old, o) : S.events.push(o);

  save(); return list.length;
}
const icsEsc = t => String(t || '').replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
const icsDT = (d, h) => d.replace(/-/g, '') + (h ? 'T' + h.replace(':', '') + '00' : '');
const icsFold = l => { const o = []; while (l.length > 74){ o.push(l.slice(0, 74)); l = ' ' + l.slice(74); } o.push(l); return o.join('\r\n'); };
function buildICS(opt){
  const N = S.settings.notify, L = [], stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const alarm = (min, title) => min < 0 ? [] : ['BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(title), `TRIGGER:${min ? '-' : ''}PT${min || 0}M`, 'END:VALARM'];
  L.push('BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Tugra//DE', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Tuğra');
  if (opt.events) S.events.filter(e => !e.iuid).forEach(e => {
    L.push('BEGIN:VEVENT', 'UID:' + e.id + '@benim-koesem', 'DTSTAMP:' + stamp, 'SUMMARY:' + icsEsc(e.title));
    if (e.start){ L.push('DTSTART:' + icsDT(e.date, e.start), 'DTEND:' + icsDT(e.date, e.end && e.end > e.start ? e.end : fromMin(Math.min(toMin(e.start) + 60, 1439)))); }
    else L.push('DTSTART;VALUE=DATE:' + icsDT(e.date), 'DTEND;VALUE=DATE:' + icsDT(addDays(e.date, 1)));
    const rr = {daily:'FREQ=DAILY', weekdays:'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly:'FREQ=WEEKLY', biweekly:'FREQ=WEEKLY;INTERVAL=2', monthly:'FREQ=MONTHLY', yearly:'FREQ=YEARLY'}[e.repeat] || (e.repeat === 'custom' ? `FREQ=${{d:'DAILY', w:'WEEKLY', m:'MONTHLY', y:'YEARLY'}[e.runit || 'w']}${(e.rint || 1) > 1 ? ';INTERVAL=' + e.rint : ''}${(e.runit || 'w') === 'w' && (e.rdays || []).length ? ';BYDAY=' + e.rdays.map(i => ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'][Number(i)]).join(',') : ''}` : '');
    if (rr) L.push('RRULE:' + rr + (e.until ? ';UNTIL=' + icsDT(e.until) + 'T235959' : ''));
    (e.skip || []).forEach(x => L.push(e.start ? 'EXDATE:' + icsDT(x, e.start) : 'EXDATE;VALUE=DATE:' + icsDT(x)));
    if (e.place) L.push('LOCATION:' + icsEsc(e.place));

    L.push('END:VEVENT');
  });

const AIK = () => lsGet('koesem.aikey') || '';
const AIM = () => lsGet('koesem.aimodel') || 'claude-haiku-5-5';
async function getSampler(){
  if (IN_CLAUDE) return claude.use('sample');
  return AIK() ? apiSampler : null;
}
async function apiCall(body, signal){
  let r;
  try {
    r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', signal, headers:{'content-type':'application/json', 'x-api-key':AIK(), 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'}, body:JSON.stringify(body)});
  } catch(e) { throw {code:e && e.name === 'AbortError' ? 'cancelled' : 'network', message:String(e)}; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw {code:r.status === 401 || r.status === 403 ? 'bad_key' : r.status === 429 ? 'rate_limited' : r.status === 529 ? 'rate_limited' : 'api', message:(j.error && j.error.message) || ('HTTP ' + r.status)};
  return j;
}
async function apiSampler(input, opts = {}){
  const msgs = typeof input === 'string' ? [{role:'user', content:input}] : input.map(m => ({role:m.role, content:m.content}));
  const tools = (opts.tools || []).map(t => ({name:t.name, description:t.description, input_schema:t.inputSchema || {type:'object', properties:{}}}));
  let text = '', truncated = false;
  for (let round = 0; round < 7; round++){
    const body = {model:AIM(), max_tokens:2000, messages:msgs};
    if (tools.length) body.tools = tools;
    if (round === 6) delete body.tools;
    const j = await apiCall(body, opts.signal);
    const blocks = j.content || [];
    const t = blocks.filter(b => b.type === 'text').map(b => b.text).join('');
    if (t){ const delta = (text ? '\n\n' : '') + t; text += delta; opts.onText && opts.onText({text, delta}); }
    truncated = j.stop_reason === 'max_tokens';
    const uses = blocks.filter(b => b.type === 'tool_use');
    if (j.stop_reason !== 'tool_use' || !uses.length) break;
    msgs.push({role:'assistant', content:blocks});
    const results = [];
    for (const u of uses){
      const tool = (opts.tools || []).find(x => x.name === u.name);
      try { const out = tool ? await tool.execute(u.input || {}, {signal:opts.signal || new AbortController().signal}) : (() => { throw new Error('Unbekanntes Werkzeug'); })(); results.push({type:'tool_result', tool_use_id:u.id, content:typeof out === 'string' ? out : JSON.stringify(out ?? {ok:true})}); }
      catch(e) { results.push({type:'tool_result', tool_use_id:u.id, content:'Error: ' + (e && e.message || e), is_error:true}); }
    }
    msgs.push({role:'user', content:results});
  }
  if (!text) throw {code:'empty_completion', message:'leer'};
  return {text, truncated, modelTierApplied:'default'};
}
apiSampler.limits = async () => ({maxPromptBytes:200000, tools:{maxCount:20}});

};

/* ================= Drag & drop sorting ================= */
function initSort(box, sel, done){
  box.addEventListener('pointerdown', e => {
    const g = e.target.closest('[data-grip]'); if (!g || !box.contains(g)) return;
    const item = g.closest(sel); if (!item) return;
    e.preventDefault();
    item.classList.add('dragging');
    let y = e.clientY, raf;
    const sc = box.closest('#sheet') || window;
    const step = () => { if (y < 110) sc.scrollBy(0, -14); else if (y > innerHeight - 130) sc.scrollBy(0, 14); raf = requestAnimationFrame(step); };
    step();
    const move = ev => {
      y = ev.clientY;
      item.style.pointerEvents = 'none';
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      item.style.pointerEvents = '';
      const tgt = el && el.closest(sel);
      if (tgt && tgt !== item && tgt.parentElement === box){
        const kids = [...box.children];
        box.insertBefore(item, kids.indexOf(item) < kids.indexOf(tgt) ? tgt.nextSibling : tgt);
      }
    };
    const up = () => {
      cancelAnimationFrame(raf); item.classList.remove('dragging');
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
      done([...box.children].filter(c => c.matches(sel)).map(c => c.dataset.wid));
    };
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  });
}

function repFields(date){
  const rep = F.repeat || 'none'; if (rep === 'none') return {repeat:'none', until:''};
  const end = F.rend || 'never', out = {repeat:rep, until:end === 'date' ? (F.until || '') : ''};
  if (rep === 'custom'){
    out.rint = Math.max(1, Math.min(99, Number(F.rint) || 1)); out.runit = ['d', 'w', 'm', 'y'].includes(F.runit) ? F.runit : 'w';
    if (out.runit === 'w'){ out.rdays = (F.rdays && F.rdays.length ? [...F.rdays] : [String(wdIdx(pd(date)))]).sort(); for (let i = 0; i < 7 && !out.rdays.includes(String(wdIdx(pd(date)))); i++) date = addDays(date, 1); }
  }
  out.date = date;
  if (out.until && out.until < date) out.until = '';
  if (end === 'count'){ out.rcount = Math.max(2, Math.min(500, Number(F.rcount) || 10)); out.until = seriesEnd(out); }
  return out;
}

const COLOR_DEFS = [['bg','Hintergrund','Fläche hinter allem'],['pageInk','Text auf dem Hintergrund','Überschriften und Untertitel'],['card','Karten','Widgets, Listen, Beiträge'],['cardInk','Text auf Karten',''],['accent','Akzent','Buttons, aktive Tabs, Häkchen'],['accentInk','Text auf dem Akzent',''],['dock','Navigation','Leiste unten oder Seitenleiste'],['dockInk','Text der Navigation',''],['sbg','Fenster','Eingaben und Einstellungen'],['sink','Text in Fenstern',''],['sfld','Eingabefelder',''],['chip','Flächen und Chips','Filter, Markierungen'],['line','Linien und Rahmen',''],['ok','Erfolg und Einnahmen',''],['warn','Warnung',''],['danger','Löschen und Fehler','']];
function toHex(v){
  v = String(v || '').trim(); if (/^#[0-9a-f]{6}$/i.test(v)) return v; if (/^#[0-9a-f]{3}$/i.test(v)) return '#' + v.slice(1).split('').map(c => c + c).join('');
  const m = v.match(/rgba?\(([^)]+)\)/); if (!m) return '#888888';
  const [r, g, b] = m[1].split(',').map(x => parseFloat(x)); return '#' + [r, g, b].map(x => pad(Math.round(x).toString(16))).join('');
}

const onField = e => {
  const t = e.target;
  if (t.dataset.cy !== undefined){ if (e.type === 'change') A.calYear({y:t.value}); return; }
  if (t.dataset.pl){ pset(t.dataset.pl, t.value); plSave(); return; }
  if (t.dataset.pli){ const a_ = t.dataset.pli.split('|'), id_ = a_.pop(), it_ = (pget(a_.join('|')) || []).find(x => x.id === id_); if (it_){ it_.t = t.value; plSave(); } return; }
  if (t.dataset.hi !== undefined){ F.items[Number(t.dataset.hi)].name = t.value; return; }
  if (t.dataset.fp){ const p_ = t.dataset.fp, base = p_.slice(0, p_.lastIndexOf('.')); setP(p_, t.value); refreshFmt(base); return; }
  if (t.dataset.fmtta && e.type === 'input'){ const pv = document.querySelector(`[data-fmtpv="${t.dataset.fmtta}"]`); if (pv) pv.innerHTML = fmtText(t.value); }
  if (t.dataset.tc){ if (!T.colors) T.colors = {}; if (t.dataset.tc === 'bg') T.bg = t.value; else T.colors[t.dataset.tc] = t.value; applyTheme(T); const row = t.closest('.crow'); row.querySelector('.sw3').style.setProperty('--cc', t.value); row.querySelector('.hex').textContent = t.value.toUpperCase(); if (e.type === 'change') studioRender(); }
  else if (t.dataset.t){ T[t.dataset.t] = t.type === 'range' ? Number(t.value) : t.value; applyTheme(T); }
  else if (t.dataset.f){
    let v = t.type === 'checkbox' ? t.checked : t.value;
    if (t.dataset.num) v = Number(v);
    setF(t.dataset.f, v); refreshPrev();
    if (['repeat', 'runit', 'rend'].includes(t.dataset.f)){ if (e.type === 'change') refreshRep(); }
    else if (['rint', 'rcount', 'until'].includes(t.dataset.f)) refreshRepSum();
  }
  else if (t.dataset.li !== undefined) F.items[Number(t.dataset.li)].t = t.value;
  else if (t.dataset.mi !== undefined){ F.items[Number(t.dataset.mi)][t.dataset.mf] = t.value; if (t.dataset.mf === 'color') t.parentElement.style.setProperty('--cc', t.value); }
  else if (t.dataset.tl){ const x = F.tools.find(o => o.id === t.dataset.tl); if (x) x.label = t.value; }
  else if (t.dataset.cq !== undefined){ if (e.type === 'input'){ const c = $('#clist'); if (c) c.innerHTML = cityList(t.value); } }
  else if (t.dataset.d){ V.draft[t.dataset.d] = t.value; if (t.classList.contains('cta')) autosize(t); }
  else if (t.dataset.q && e.type === 'input'){ V[t.dataset.q] = t.value; const k = t.dataset.q, pos = t.selectionStart; render(); const n = document.querySelector(`[data-q=${k}]`); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(_) {} } }
};

};
const lgKey = () => LG[S.settings.logo] ? S.settings.logo : 'altin';
/* Tuğra im klassischen Aufbau: Sere (Basis), drei Tuğ (Senkrechte), Zülfe (Fahnen), Beyze (Schleifen), Hançer (Striche nach rechts) */
let _tgN = 0;
function tugraArt(c, {w = 1, anim = false, gid} = {}){
  const G = `url(#${gid})`;
  let n = 0;
  const S_ = (d, sw) => `<path d="${d}" fill="none" stroke="${G}" stroke-width="${sw * w}" stroke-linecap="round" stroke-linejoin="round"${anim ? ` pathLength="1" class="tg-s" style="--i:${n++}"` : ''}/>`;
  const beyze = [S_('M142 146 C104 160 22 158 14 116 C7 78 58 56 102 68 C134 77 144 106 128 132', 6), S_('M132 138 C104 147 52 143 48 116 C45 93 80 82 108 93 C124 99 127 118 116 129', 4.2)];
  const tug = [[124, 6], [138, 12], [152, 18]].map(([x, top]) => S_(`M${x} 150 C${x - 1} 110 ${x - 2} 60 ${x} ${top + 14}`, 5.2) + S_(`M${x} ${top + 16} C${x + 1} ${top + 6} ${x - 3} ${top} ${x - 8} ${top + 4}`, 3));
  const zulfe = ['M110 60 C140 40 196 40 222 70', 'M118 76 C150 58 200 62 220 92', 'M128 92 C158 80 196 86 212 108'].map((d, i) => S_(d, 2.4 - i * .3));
  const hancer = [S_('M138 154 C180 152 220 142 246 124', 4.4), S_('M144 166 C184 166 220 156 244 140', 3)];
  const sere = [S_('M96 164 C116 179 150 179 172 162', 3.4), S_('M162 150 C168 138 182 142 179 153 C177 161 165 161 163 155', 3), S_('M106 150 C112 142 121 146 118 154', 3)];
  const dots = [[112, 173], [150, 185], [188, 171]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${3.4 * w}" fill="${G}"${anim ? ' class="tg-d"' : ''}/>`).join('');
  const tl = c.tulip ? `<g transform="translate(70 100)"${anim ? ' class="tg-t"' : ''}><path d="M12 26 C4 22 2 10 6 1 C9 8 12 10 12 10 C12 10 15 8 18 1 C22 10 20 22 12 26Z" fill="${c.tulip}"/><path d="M12 11 C10 4 12 -3 12 -3 C12 -3 14 4 12 11Z" fill="${c.tulip}" opacity=".8"/><path d="M12 26 C12 33 11 38 9 43 M11 34 C6 33 3 29 2 25" stroke="${G}" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>` : '';
  return [...beyze, ...hancer, ...tug, ...zulfe, ...sere].join('') + dots + tl;
}
const tgDefs = (c, gid) => `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c.ink}"/><stop offset="1" stop-color="${c.ink2}"/></linearGradient></defs>`;
// Ohne Hintergrund (Inhalt etwa x 8–250, y 4–190)
const tugraMark = (c, cls = '', opt = {}) => { const gid = 'tg' + (++_tgN); return `<svg class="lg ${cls}" viewBox="4 0 250 194" aria-hidden="true">${tgDefs(c, gid)}${tugraArt(c, {...opt, gid})}</svg>`; };
// Als App-Symbol (quadratisch, mit Fläche)
const tugraIcon = (c, {w = 1, round = true, xmlns = false} = {}) => { const gid = 'tg' + (++_tgN); return `<svg ${xmlns ? 'xmlns="http://www.w3.org/2000/svg" width="512" height="512"' : 'class="lg"'} viewBox="0 -34 258 258" aria-hidden="true">${tgDefs(c, gid)}<rect x="0" y="-34" width="258" height="258" ${round ? 'rx="58"' : ''} fill="${c.tile}"/>${tugraArt(c, {w, gid})}</svg>`; };
const lgTile = k => tugraIcon(LG[k], {w:1.25});
function logoPill(){
  const c = LG[lgKey()];
  return `<button class="homelogo" data-act="logoPlay" aria-label="Tuğra, Animation abspielen" style="background:${c.tile};color:${c.word}">${tugraMark(c, 'hl-mark', {w:1.5})}<span class="hl-word">Tuğra</span></button>`;
}
function splashHTML(k){
  const c = LG[k];
  return `<div class="sp-in" style="color:${c.word}">${tugraMark(c, 'sp-mark', {anim:true})}<div class="sp-word">Tuğra</div></div>`;
}
function iconPNG(k, size, cb){
  const svg = tugraIcon(LG[k], {w:1.3, round:false, xmlns:true});
  const img = new Image();
  img.onload = () => { try { const cv = document.createElement('canvas'); cv.width = cv.height = size; cv.getContext('2d').drawImage(img, 0, 0, size, size); cb(cv.toDataURL('image/png')); } catch(e) {} };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function setLink(rel, id, href, sizes){
  const old = document.getElementById(id), n = document.createElement('link');
  n.rel = rel; n.id = id; if (sizes) n.sizes = sizes; n.href = href;
  old ? old.replaceWith(n) : document.head.appendChild(n);
}
function applyLogo(){
  const k = lgKey();
  document.documentElement.dataset.logo = k;
  iconPNG(k, 180, u => setLink('apple-touch-icon', 'appicon', u, '180x180'));
  iconPNG(k, 64, u => setLink('icon', 'favicon', u, '64x64'));
}
let spT = null;
function playSplash(enter){
  const el = $('#splash'); if (!el) return;
  clearTimeout(spT);
  el.className = 'play'; el.innerHTML = splashHTML(lgKey()); el.onpointerdown = null;
  const finish = () => {
    clearTimeout(spT); el.onpointerdown = null; el.classList.add('out');
    if (enter === true){ document.body.classList.add('enter'); setTimeout(() => document.body.classList.remove('enter'), 900); }
    spT = setTimeout(() => el.classList.add('gone'), 520);
  };
  spT = setTimeout(finish, 2700);
  el.onpointerdown = finish;
}
